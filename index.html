<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Ranking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>A Galatic Ranking</h1>
        
        <!-- Bereich für die aktive Auswahl -->
        <div class="selection-area">
            <h2 id="current-prompt">Wähle deinen Platz 1</h2>
            <div id="character-pool" class="horizontal-pool">
                <!-- Wird von JavaScript befüllt -->
            </div>
        </div>

        <!-- Bereich für das fertige Ranking -->
        <div class="ranking-area">
            <h2>Dein Top 5 Ranking</h2>
            <div id="ranking-board" class="vertical-board">
                <div class="rank-slot" id="rank-1"><span class="rank-number">1.</span> <span class="placeholder-text">Wartet auf Auswahl...</span></div>
                <div class="rank-slot" id="rank-2"><span class="rank-number">2.</span> <span class="placeholder-text">Wartet auf Auswahl...</span></div>
                <div class="rank-slot" id="rank-3"><span class="rank-number">3.</span> <span class="placeholder-text">Wartet auf Auswahl...</span></div>
                <div class="rank-slot" id="rank-4"><span class="rank-number">4.</span> <span class="placeholder-text">Wartet auf Auswahl...</span></div>
                <div class="rank-slot" id="rank-5"><span class="rank-number">5.</span> <span class="placeholder-text">Wartet auf Auswahl...</span></div>
            </div>
        </div>
        
        <button id="restart-btn" class="hidden">Neues Spiel starten</button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
